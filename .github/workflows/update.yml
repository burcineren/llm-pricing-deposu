name: Daily update

on:
  schedule:
    # 06:15 UTC — after the US business day, so a price change announced yesterday
    # has had time to land in the upstream feeds.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and report, but commit nothing'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      # Pipeline or curation changes should regenerate the outputs immediately.
      - 'scripts/**'
      - 'overrides/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch, merge and render
        id: run
        run: node scripts/update.js ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Validate
        if: ${{ !inputs.dry_run }}
        run: node scripts/validate.js

      - name: Build site data
        if: ${{ !inputs.dry_run }}
        run: node scripts/build-site.js

      - name: Job summary
        run: |
          {
            echo "### Data update"
            echo
            echo "- Changes: **${{ steps.run.outputs.changes || 0 }}**"
            echo "- Summary: ${{ steps.run.outputs.summary || 'no changes' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data docs README.md README.tr.md CHANGELOG.md

          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi

          CHANGES="${{ steps.run.outputs.changes || 0 }}"
          SUMMARY="${{ steps.run.outputs.summary }}"
          if [ "$CHANGES" -gt 0 ]; then
            git commit -m "data: $SUMMARY" -m "Automated daily update."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          fi

          # The daily job and a `scripts/**` push can land within seconds of each other.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
